[project]
name = "tropical-adventure"
version = "0.1.0"
description = "Network-first terminal tropical island survival game"
requires-python = ">=3.12"
dependencies = ["textual>=0.89.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
